server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name api.hyeonserver.shop;

  ssl_certificate     /etc/letsencrypt/live/api.hyeonserver.shop/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.hyeonserver.shop/privkey.pem;

  location / {

    # CORS preflight
    if ($request_method = OPTIONS) {
      add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
      add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-USER-UUID' always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;
      return 204;
    }

    add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    proxy_pass http://smakers-spring:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

