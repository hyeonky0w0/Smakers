server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name api.hyeonserver.shop;

  ssl_certificate     /etc/letsencrypt/live/api.hyeonserver.shop/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.hyeonserver.shop/privkey.pem;

  location / {

    # ✅ CORS: 모든 응답에 공통으로 "딱 1번만" 붙이기
    add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-USER-UUID' always;

    # ✅ Preflight(OPTIONS)는 204로 즉시 종료 (헤더는 위에서 이미 붙음)
    if ($request_method = OPTIONS) {
      return 204;
    }

    proxy_pass http://smakers-spring:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}


