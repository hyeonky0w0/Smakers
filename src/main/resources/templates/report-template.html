<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        /* PDF 생성을 위한 기본 설정 */
        body {
            font-family: 'Arial', sans-serif; /* 한글 폰트 설정은 아래 팁 참고! */
            line-height: 1.6;
            color: #333;
            margin: 20px;
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #4A90E2;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }
        .section {
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #4A90E2;
            margin-bottom: 10px;
            border-left: 5px solid #4A90E2;
            padding-left: 10px;
        }
        .content-box {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .memo-item, .chat-item {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #ccc;
        }
        .memo-item:last-child, .chat-item:last-child {
            border-bottom: none;
        }
        .capture-img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 20px auto;
            border: 1px solid #eee;
            border-radius: 5px;
        }
        .question { font-weight: bold; color: #555; }
        .answer { margin-top: 5px; color: #666; }
    </style>
</head>
<body>

<div class="header">
    <h1>학습 분석 리포트</h1>
</div>

<div class="section" th:if="${captureImage != null}">
    <div class="section-title">분석 스크린샷</div>
    <img th:src="${captureImage}" class="capture-img" />
</div>

<div class="section">
    <div class="section-title">선택된 학습 메모</div>
    <div class="content-box">
        <div th:each="memo : ${memos}" class="memo-item">
            <div class="question" th:text="${memo.title}">메모 제목</div>
            <div class="answer" th:text="${memo.contents}">메모 내용</div>
        </div>
        <div th:if="${#lists.isEmpty(memos)}">선택된 메모가 없습니다.</div>
    </div>
</div>

<div class="section">
    <div class="section-title">AI 질의응답 히스토리</div>
    <div class="content-box">
        <div th:each="chat : ${chats}" class="chat-item">
            <div class="question">Q: <span th:text="${chat.question}">질문 내용</span></div>
            <div class="answer">A: <span th:text="${chat.answer}">AI 답변 내용</span></div>
        </div>
        <div th:if="${#lists.isEmpty(chats)}">선택된 채팅 내역이 없습니다.</div>
    </div>
</div>

</body>
</html>
