<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        /* 1. 기본 설정 및 폰트 */
        body {
            font-family: 'NanumGothic', sans-serif;
            line-height: 1.5;
            color: #333;
            margin: 30px;
        }

        /* 2. 헤더 영역 */
        .header {
            text-align: center;
            border-bottom: 2px solid #4A90E2;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 24px;
            color: #2c3e50;
            margin: 0;
        }

        /* 3. 섹션 스타일 */
        .section {
            margin-bottom: 15px;
        }
        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: #4A90E2;
            margin-bottom: 10px;
            border-left: 4px solid #4A90E2;
            padding-left: 8px;
            page-break-after: avoid;
        }

        /* 4. 공통 박스 디자인 */
        .memo-item, .chat-item {
            margin-bottom: 12px;
            padding: 15px;
            background-color: #fcfcfc;
            border: 1px solid #eef2f6;
            border-radius: 8px;
            page-break-inside: auto !important;
        }

        /* 5. 메모 제목 (두껍게 강조) */
        .memo-header {
            font-weight: 800 !important;
            font-size: 15px;
            color: #2c3e50;
            margin-bottom: 6px;
        }
        .memo-body {
            font-size: 13px;
            color: #555;
            white-space: pre-wrap;
        }

        /* 6. 질문(Q) 강조 */
        .question-box {
            font-size: 15px;
            font-weight: 800 !important;
            color: #2c3e50;
            margin-bottom: 10px;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 5px;
        }

        /* 7. 답변(A) 테이블 레이아웃 (iText 에러 방지 핵심) */
        .answer-row {
            display: table;
            width: 100%;
        }
        .answer-label {
            display: table-cell;
            width: 25px;
            font-weight: 900;
            font-size: 15px;
            color: #4A90E2;
            vertical-align: top;
            padding-top: 10px; /* 답변 박스 패딩과 일치 */
        }
        .answer-content {
            display: table-cell;
            font-size: 13px !important; /* 폰트 튀는 현상 방지 */
            line-height: 1.6;
            color: #444;
            background-color: #f8f9fa;
            padding: 12px;
            border-radius: 5px;
            white-space: pre-wrap;
            text-align: left !important;
            vertical-align: top;
        }

        /* 8. 이미지 */
        .capture-img {
            max-width: 80%;
            height: auto;
            display: block;
            margin: 10px auto;
            border-radius: 5px;
        }

        /* 9. 페이지 번호 */
        @page {
            size: A4;
            margin: 20mm;
            @bottom-center {
                content: counter(page) " / " counter(pages);
                font-family: 'NanumGothic', sans-serif;
                font-size: 10pt;
                color: #888;
            }
        }
    </style>
</head>
<body>

<div class="header">
    <h1 th:text="${reportTitle != null ? reportTitle : '학습 분석 리포트'}">학습 분석 리포트</h1>
</div>

<div class="section" th:if="${captureImage != null}">
    <div class="section-title">분석 스크린샷</div>
    <img th:src="${captureImage}" class="capture-img" />
</div>

<div class="section" th:if="${not #lists.isEmpty(memos)}">
    <div class="section-title">학습 메모</div>
    <div th:each="memo : ${memos}" class="memo-item">
        <div class="memo-header" th:text="${memo.memoTitle}">메모 제목</div>
        <div class="memo-body" th:text="${memo.memoContents}">메모 내용</div>
    </div>
</div>

<hr th:if="${not #lists.isEmpty(memos)} and ${not #lists.isEmpty(chats)}" style="border: 0; border-top: 1px solid #eee; margin: 20px 0;"/>

<div class="section" th:if="${not #lists.isEmpty(chats)}">
    <div class="section-title">AI 질의응답</div>
    <div th:each="chat : ${chats}" class="chat-item">
        <div class="question-box">
            <strong>Q.</strong> <span th:text="${chat.question}">질문 내용</span>
        </div>

        <div class="answer-row">
            <div class="answer-label">A.</div>
            <div class="answer-content" th:text="${chat.answer}">답변 내용</div>
        </div>
    </div>
</div>

</body>
</html>
