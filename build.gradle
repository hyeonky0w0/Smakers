plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Smakers-BE'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'com.mysql:mysql-connector-j'

    // Swagger (springdoc) - Boot4 호환 최신 2.x로
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.0'

    // s3
    implementation platform('software.amazon.awssdk:bom:2.20.120')
    implementation 'software.amazon.awssdk:s3'
    implementation "software.amazon.awssdk:s3:2.25.60"
    implementation "software.amazon.awssdk:auth:2.25.60"
    implementation "software.amazon.awssdk:regions:2.25.60"

    // json 파싱
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.json:json:20231013'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


tasks.named('test') {
    useJUnitPlatform()
}
